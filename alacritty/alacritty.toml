[env]
TERM = "xterm-256color"

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[font]
size = 18
normal = { family = "UbuntuMono Nerd Font" }


[window]
decorations = "none"

[window.padding]
x = 7
y = 7


[terminal]
osc52 = "CopyPaste"

[shell]
program = "zsh"
args = ["-l", "-c", "exec tmux new-session -A -s main"]
