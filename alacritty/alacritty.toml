[env]
TERM = "xterm-256color"

[window]
decorations = "None"
opacity = 0.98

[window.padding]
x = 16
y = 14

[font]
size = 14
normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
bold = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
italic = { family = "CaskaydiaMono Nerd Font", style = "Italic" }

[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"

[colors.normal]
black = "#32344a"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#ad8ee6"
cyan = "#449dab"
white = "#787c99"

[colors.bright]
black = "#444b6a"
red = "#ff7a93"
green = "#b9f27c"
yellow = "#ff9e64"
blue = "#7da6ff"
magenta = "#bb9af7"
cyan = "#0db9d7"
white = "#acb0d0"

[colors.selection]
background = "#7aa2f7"

[keyboard]
bindings = [
  { key = "F11", action = "ToggleFullscreen" },
]

[terminal]
osc52 = "CopyPaste"

[shell]
program = "zsh"
args = ["-l", "-c", "exec tmux new-session -A -s main"]
